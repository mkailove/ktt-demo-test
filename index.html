<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>快团团素材生成器</title>
  <style>
    :root { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: #242832; background: #f5f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #308bed; outline-offset: 2px; }
    .app { display: grid; grid-template-columns: minmax(340px, 500px) minmax(0, 1fr); min-height: 100vh; }
    .editor { background: #fff; border-right: 1px solid #e5e8ee; height: 100vh; overflow-y: auto; overscroll-behavior: contain; padding: 24px 24px 22px; }
    .brand-line { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
    .brand-icon { display: grid; place-items: center; flex: 0 0 30px; width: 30px; height: 30px; border: 1px solid #242832; border-radius: 7px; color: #242832; }
    .brand-icon svg { width: 23px; height: 23px; }
    h1 { font-size: 20px; margin: 0; letter-spacing: -.04em; }
    .local-badge { background: #e4f8eb; color: #187b47; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 5px 10px; }
    section { border-top: 1px solid #e6e9ee; padding: 22px 0 20px; }
    h2 { margin: 0 0 15px; font-size: 14px; color: #465773; }
    label { display: block; font-size: 14px; color: #3d4d68; font-weight: 700; margin-bottom: 8px; }
    .field { min-width: 0; margin-bottom: 15px; }
    .field:last-child { margin-bottom: 0; }
    input:not([type="file"]), select, textarea { display: block; width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #d4ddec; border-radius: 8px; background: #fff; color: #252a34; outline-color: #ff4b5b; }
    textarea { min-height: 88px; resize: vertical; line-height: 1.5; }
    input[type="file"] { width: 100%; color: #546178; font-size: 14px; }
    .help { font-size: 12px; color: #66758d; margin-top: 6px; line-height: 1.5; }
    .grid-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .templates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .template { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 5px; border: 1px solid #d5deeb; border-radius: 8px; background: #fff; color: #293044; font-size: 16px; min-height: 78px; }
    .template::before { content: ""; display: block; width: 100%; height: 29px; border-radius: 6px; background: var(--swatch); }
    .template[aria-pressed="true"] { border-color: #ff4b5b; color: #ff4b5b; font-weight: 700; box-shadow: 0 0 0 2px #ff4b5b16; }
    .bullet-row { display: grid; grid-template-columns: 1fr 40px; gap: 7px; margin-bottom: 8px; }
    .bullet-row input { margin: 0; }
    .remove-bullet { border: 0; background: #ffe9eb; color: #fb4d60; border-radius: 8px; font-size: 20px; }
    .add-bullet { width: 100%; min-height: 44px; border: 1px dashed #c7d2e4; border-radius: 8px; background: #fff; color: #4b668e; }
    .add-bullet:disabled { cursor: default; opacity: .45; }
    .error { font-size: 12px; color: #c32436; margin-top: 5px; min-height: 0; }
    .error:empty { display: none; }
    .actions { position: sticky; bottom: -22px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #fff; padding: 16px 0 20px; border-top: 1px solid #e6e9ee; }
    .actions button { min-height: 46px; border-radius: 7px; font-weight: 700; }
    .reset { background: #fff; border: 1px solid #cbd5e3; color: #75839b; }
    .export { background: #23272f; color: #fff; border: 1px solid #23272f; }
    .status { min-height: 18px; color: #52647e; font-size: 13px; margin: -10px 0 0; }
    .preview-area { display: flex; align-items: center; justify-content: center; min-width: 0; padding: 35px; background-color: #f5f6f8; background-image: linear-gradient(#e8ebef 1px, transparent 1px), linear-gradient(90deg, #e8ebef 1px, transparent 1px); background-size: 28px 28px; }
    .preview-frame { width: min(390px, 100%); aspect-ratio: 9 / 16; background: white; border: 1px solid transparent; border-radius: 18px; box-shadow: 0 18px 44px #1d243014, 0 3px 10px #1d24300a; overflow: hidden; }
    #poster-canvas { display: block; width: 100%; height: 100%; }
    button:not(:disabled):active { opacity: .86; }
    @media (prefers-reduced-motion: no-preference) { .actions button, .template { transition: transform 150ms ease-out; } .actions button:not(:disabled):active, .template:not(:disabled):active { transform: scale(0.96); } }
    @media (prefers-reduced-motion: reduce) { button { transition: opacity 150ms ease-out; } }
    @media (max-width: 800px) { .app { display: block; } .editor { height: auto; overflow: visible; border-right: 0; } .preview-area { min-height: 80vh; padding: 28px 16px; } .actions { bottom: 0; } }
    @media (max-width: 390px) { .editor { padding: 20px 15px; } .template { font-size: 14px; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="editor">
      <header class="brand-line"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h2l2.1 11h11.2l2-8.5H5.1"/><path d="M7.2 15.5h11"/><circle cx="9" cy="19" r="1"/><circle cx="17" cy="19" r="1"/></svg></span><h1>快团团素材生成器</h1><span class="local-badge">本地版</span></header>
      <section aria-labelledby="template-heading">
        <h2 id="template-heading">版式模板</h2>
        <div class="templates" role="group" aria-label="版式模板">
          <button class="template" type="button" data-template="center" style="--swatch:linear-gradient(90deg,#ff4b5b,#ff8b94)">居中促销</button>
          <button class="template" type="button" data-template="left" style="--swatch:linear-gradient(90deg,#20a9c7,#72cee0)">左图清单</button>
          <button class="template" type="button" data-template="hero" style="--swatch:linear-gradient(90deg,#ff783f,#ffab84)">大图爆款</button>
        </div>
      </section>
      <section aria-labelledby="basic-heading">
        <h2 id="basic-heading">基础信息</h2>
        <div class="field"><label for="tag">顶部标签</label><input id="tag" data-field="tag"><div class="error" data-error="tag"></div></div>
        <div class="field"><label for="brand">团长昵称 / 品牌</label><input id="brand" data-field="brand"><div class="error" data-error="brand"></div></div>
        <div class="field"><label for="title">商品标题</label><input id="title" data-field="title" aria-required="true"><div class="error" data-error="title"></div></div>
        <div class="field"><label for="subtitle">副标题 / 一句话卖点</label><input id="subtitle" data-field="subtitle"><div class="error" data-error="subtitle"></div></div>
      </section>
      <section aria-labelledby="image-heading">
        <h2 id="image-heading">图片素材</h2>
        <div class="field"><label for="image-file">商品主图</label><input id="image-file" type="file"><div class="help">推荐 3:4；方图会自动按 1:1 展示，预览和导出都只在本机处理。</div><div class="error" data-error="image"></div></div>
        <div class="grid-two">
          <div class="field"><label for="ratio-mode">图片展示比例</label><select id="ratio-mode" data-field="ratioMode"><option value="auto">自动识别</option><option value="3:4">3:4</option><option value="1:1">1:1</option><option value="original">保留原图比例</option></select></div>
          <div class="field"><label for="fit-mode">图片适配方式</label><select id="fit-mode" data-field="fitMode"><option value="contain">完整展示</option><option value="cover">铺满裁切</option></select></div>
        </div>
        <div class="field"><label for="qr-file">二维码</label><input id="qr-file" type="file"><div class="help">上传团长二维码或商品码。</div><div class="error" data-error="qr"></div></div>
      </section>
      <section aria-labelledby="bullets-heading"><h2 id="bullets-heading">核心卖点</h2><div id="bullet-list"></div><button id="add-bullet" class="add-bullet" type="button">＋ 添加一条卖点</button><div class="error" data-error="bullets"></div></section>
      <section aria-labelledby="price-heading">
        <h2 id="price-heading">价格和转化文案</h2>
        <div class="grid-two">
          <div class="field"><label for="original-price">原价 ¥</label><input id="original-price" data-field="originalPrice" inputmode="decimal"><div class="error" data-error="originalPrice"></div></div>
          <div class="field"><label for="group-price">团购价 ¥</label><input id="group-price" data-field="groupPrice" inputmode="decimal" aria-required="true"><div class="error" data-error="groupPrice"></div></div>
        </div>
        <div class="field"><label for="leader-note">团长说</label><textarea id="leader-note" data-field="leaderNote"></textarea><div class="error" data-error="leaderNote"></div></div>
        <div class="field"><label for="shipping">规格 / 发货信息</label><input id="shipping" data-field="shipping"><div class="error" data-error="shipping"></div></div>
        <div class="grid-two">
          <div class="field"><label for="cta-main">按钮主文案</label><input id="cta-main" data-field="ctaMain"><div class="error" data-error="ctaMain"></div></div>
          <div class="field"><label for="cta-sub">按钮副文案</label><input id="cta-sub" data-field="ctaSub"><div class="error" data-error="ctaSub"></div></div>
        </div>
      </section>
      <div class="actions"><button id="reset" class="reset" type="button">恢复示例</button><button id="export" class="export" type="button">导出 PNG</button></div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>
    <div class="preview-area" aria-label="海报预览">
      <div class="preview-frame">
        <canvas id="poster-canvas" width="720" height="1280" aria-label="海报画布"></canvas>
      </div>
    </div>
  </main>
  <script id="app-script">
  const app = (() => {
    function createDefaultState() {
      return {
        template: 'center', tag: '今日开团', brand: '小美优选·团长',
        title: '【新疆直发】阿克苏冰糖心苹果 5斤装',
        subtitle: '咬一口爆汁甜脆·产地现摘现发',
        bullets: ['产地直发，没有中间商加价', '冰糖心占比高，一口爆汁甜', '坏果包赔，售后无忧'],
        originalPrice: '39.90', groupPrice: '19.90',
        leaderNote: '我自己吃了两箱，真的甜！这个价格基本就是产地价了。',
        shipping: '5斤/箱·默认圆通·48h 内发货·坏果包赔',
        ctaMain: '长按识别 跟团购买', ctaSub: '早买早发·手慢无',
        ratioMode: 'auto', fitMode: 'contain', image: null, qr: null,
      };
    }

    function countCodePoints(value) { return Array.from(value).length; }

    function parseMoneyToCents(value) {
      const text = String(value).trim();
      if (!/^(0|[1-9]\d{0,5})(?:\.\d{1,2})?$/.test(text)) return null;
      const [yuan, fraction = ''] = text.split('.');
      return Number(yuan) * 100 + Number(fraction.padEnd(2, '0'));
    }

    function validateFields(state) {
      const errors = [];
      const add = (field, message) => errors.push({ field, message });
      const checkText = (field, label, limit, multiline = false) => {
        const value = String(state[field] ?? '');
        const normalized = multiline ? value.replace(/\r\n?/g, '\n') : value.trim();
        if (!multiline && /[\r\n]/.test(value)) add(field, `${label}不能换行`);
        if (countCodePoints(normalized) > limit) add(field, `${label}最多 ${limit} 字`);
        return normalized;
      };
      checkText('tag', '顶部标签', 12);
      checkText('brand', '团长品牌', 24);
      if (!checkText('title', '商品标题', 60)) add('title', '请填写商品标题');
      checkText('subtitle', '副标题', 60);
      checkText('leaderNote', '团长说', 48, true);
      checkText('shipping', '发货信息', 40);
      checkText('ctaMain', '购买主文案', 16);
      checkText('ctaSub', '购买副文案', 24);
      if (!Array.isArray(state.bullets) || state.bullets.length > 6) add('bullets', '核心卖点最多 6 条');
      for (const bullet of state.bullets || []) {
        if (countCodePoints(String(bullet).trim()) > 35) add('bullets', '每条核心卖点最多 35 字');
        if (/[\r\n]/.test(String(bullet))) add('bullets', '核心卖点不能换行');
      }
      const group = parseMoneyToCents(state.groupPrice);
      const original = String(state.originalPrice).trim() === '' ? null : parseMoneyToCents(state.originalPrice);
      if (group === null || group <= 0) add('groupPrice', '团购价须大于 0，最多两位小数且不超过 999999.99 元');
      if (String(state.originalPrice).trim() !== '' && original === null) add('originalPrice', '原价格式无效，最多两位小数且不超过 999999.99 元');
      if (original !== null && group !== null && original < group) add('originalPrice', '原价不能低于团购价');
      return errors;
    }

    function validateImageMeta(file, width, height, kind) {
      const errors = [];
      const field = kind === 'qr' ? 'qr' : 'image';
      const add = message => errors.push({ field, message });
      if (!Number.isFinite(width) || !Number.isFinite(height) || width <= 0 || height <= 0) add('图片无法解码，请重新选择文件');
      return errors;
    }

    function createImageSelectionController(decode) {
      const selected = { image: null, qr: null };
      const request = { image: 0, qr: 0 };
      function close(entry) { if (entry?.bitmap && typeof entry.bitmap.close === 'function') entry.bitmap.close(); }
      return {
        current(kind) { return selected[kind]; },
        clear(kind) { request[kind] += 1; close(selected[kind]); selected[kind] = null; },
        async select(kind, file) {
          const token = ++request[kind];
          if (!file) return { applied: false, cancelled: true, errors: [] };
          let decoded;
          try { decoded = await decode(file); }
          catch {
            if (token !== request[kind]) return { applied: false, stale: true, errors: [] };
            return { applied: false, errors: [{ field: kind, message: '图片无法解码，请重新选择文件' }] };
          }
          if (token !== request[kind]) { close(decoded); return { applied: false, stale: true, errors: [] }; }
          const errors = validateImageMeta(file, decoded.width, decoded.height, kind);
          if (errors.length) { close(decoded); return { applied: false, errors }; }
          close(selected[kind]);
          selected[kind] = { file, bitmap: decoded.bitmap, width: decoded.width, height: decoded.height };
          return { applied: true, errors: [] };
        },
      };
    }

    function computeImagePlacement(source, box, ratioMode, fitMode) {
      const sourceRatio = source.width / source.height;
      const ratio = ratioMode === '3:4' ? 0.75 : ratioMode === '1:1' ? 1 :
        ratioMode === 'auto' && sourceRatio >= 0.9 && sourceRatio <= 1.1 ? 1 :
        Math.max(0.55, Math.min(1.3, sourceRatio));
      const width = Math.min(box.width, box.height * ratio);
      const height = width / ratio;
      const x = box.x + (box.width - width) / 2;
      const y = box.y + (box.height - height) / 2;
      const scale = fitMode === 'cover' ? Math.max(width / source.width, height / source.height) : Math.min(width / source.width, height / source.height);
      const sourceWidth = fitMode === 'cover' ? width / scale : source.width;
      const sourceHeight = fitMode === 'cover' ? height / scale : source.height;
      const drawWidth = fitMode === 'cover' ? width : source.width * scale;
      const drawHeight = fitMode === 'cover' ? height : source.height * scale;
      return {
        x, y, width, height, drawX: x + (width - drawWidth) / 2, drawY: y + (height - drawHeight) / 2,
        drawWidth, drawHeight, sourceX: (source.width - sourceWidth) / 2, sourceY: (source.height - sourceHeight) / 2,
        sourceWidth, sourceHeight,
      };
    }

    function wrapText(text, maxWidth, size, measureText, weight = 'normal') {
      const lines = [];
      for (const paragraph of String(text).replace(/\r\n?/g, '\n').split('\n')) {
        let line = '';
        for (const character of Array.from(paragraph)) {
          if (line && measureText(line + character, size, weight) > maxWidth) { lines.push(line); line = character; }
          else line += character;
        }
        lines.push(line);
      }
      return lines;
    }

    function buildPosterLayout(state, measureText) {
      const theme = { center: '#FF4B5B', left: '#20A9C7', hero: '#FF783F' }[state.template] || '#FF4B5B';
      const isLeft = state.template === 'left';
      const isHero = state.template === 'hero';
      const isCenterWide = !isLeft && !isHero && state.image &&
        (state.ratioMode === 'auto' || state.ratioMode === 'original') && state.image.width / state.image.height > 1.1;
      const bulletFont = isLeft ? 20 : 22;
      const bulletLineHeight = isLeft ? 28 : 30;
      const bulletX = isLeft ? 492 : 90;
      const bulletWidth = isLeft ? 188 : 584;
      const bullets = (state.bullets || []).map(item => String(item).trim()).filter(Boolean);
      const bulletRows = bullets.map(value => {
        const lines = wrapText(value, bulletWidth, bulletFont, measureText, 'bold');
        return { value, lines, height: Math.max(36, lines.length * bulletLineHeight + 6) };
      });
      const bulletHeight = bulletRows.reduce((sum, row) => sum + row.height, 0);
      const imageTop = isHero ? 224 : 226;
      const imageMaxHeight = isHero ? 492 : 520;
      const imageHeight = isLeft ? 656 : Math.max(320, Math.min(imageMaxHeight, 880 - 28 - bulletHeight - imageTop));
      const bulletTop = isLeft ? 240 : imageTop + imageHeight + 28;
      const regions = {
        image: isLeft ? { x: 32, y: 224, width: 396, height: imageHeight } :
          isHero ? { x: 32, y: imageTop, width: 656, height: imageHeight } :
          { x: isCenterWide ? 32 : 100, y: imageTop, width: isCenterWide ? 656 : 520, height: imageHeight },
        bullets: isLeft ? { x: 448, y: bulletTop, width: 240, height: 640 } :
          { x: 32, y: bulletTop, width: 656, height: 880 - bulletTop },
      };
      const elements = [];
      const errors = [];
      const rect = (x, y, width, height, color) => elements.push({ kind: 'rect', x, y, width, height, color });
      const rounded = (x, y, width, height, radius, color, options = {}) => elements.push({ kind: 'round-rect', x, y, width, height, radius, color, ...options });
      function text(field, value, box, size, lineHeight, color = '#242832', weight = 'normal') {
        if (!String(value ?? '').trim()) return;
        const lines = wrapText(String(value).trim(), box.width, size, measureText, weight);
        const capacity = Math.floor(box.height / lineHeight);
        if (lines.length > capacity || lines.some(line => measureText(line, size, weight) > box.width)) errors.push({ field, message: `${field === 'bullets' ? '核心卖点' : field === 'leaderNote' ? '团长说' : field === 'title' ? '商品标题' : field}内容放不下，请缩短文字` });
        lines.slice(0, capacity).forEach((line, index) => elements.push({ kind: 'text', field, text: line, x: box.x, y: box.y + index * lineHeight, fontSize: size, color, weight }));
      }
      function centeredText(field, value, x, y, width, size, color, weight = 'normal', align = 'left') {
        if (measureText(value, size, weight) > width) errors.push({ field, message: `${field}内容放不下，请缩短文字` });
        elements.push({ kind: 'text', field, text: value, x, y, fontSize: size, color, weight, align, baseline: 'middle' });
      }
      rect(0, 0, 720, 90, theme);
      const tag = String(state.tag).trim();
      const tagWidth = tag ? Math.min(172, Math.max(112, measureText(tag, 21, 'bold') + 32)) : 0;
      if (String(state.brand).trim()) centeredText('brand', String(state.brand).trim(), 36, 45, tag ? 640 - tagWidth : 652, 27, '#ffffff', 'bold');
      if (tag) {
        rounded(688 - tagWidth, 22, tagWidth, 46, 23, '#FFE36B');
        centeredText('tag', tag, 688 - tagWidth / 2, 45, tagWidth - 32, 21, '#242832', 'bold', 'center');
      }
      const titleLines = wrapText(String(state.title).trim(), 640, 34, measureText, 'bold');
      const titleIsSingleLine = titleLines.length <= 1;
      text('title', state.title, { x: 40, y: titleIsSingleLine ? 106 : 100, width: 640, height: 84 }, 34, 42, '#242832', 'bold');
      const subtitle = String(state.subtitle).trim();
      if (subtitle) {
        const subtitleWidth = Math.min(640, measureText(subtitle, 22, 'bold') + 36);
        const subtitleY = titleIsSingleLine ? 176 : 184;
        rounded(40, subtitleY, subtitleWidth, 38, 19, '#F2F4F6');
        centeredText('subtitle', subtitle, 54, subtitleY + 19, subtitleWidth - 28, 22, '#738098', 'bold');
      }
      const imagePlacement = computeImagePlacement(state.image || { width: 3, height: 4 }, regions.image, state.ratioMode, state.fitMode);
      rounded(imagePlacement.x, imagePlacement.y, imagePlacement.width, imagePlacement.height, 24, '#EFF2F5', { shadow: true });
      if (state.image) elements.push({ kind: 'image', field: 'image', placement: imagePlacement, radius: 24 });
      else {
        elements.push({ kind: 'placeholder-image', x: imagePlacement.x, y: imagePlacement.y, width: imagePlacement.width, height: imagePlacement.height });
        text('image', '商品主图', { x: imagePlacement.x + imagePlacement.width / 2 - 70, y: imagePlacement.y + imagePlacement.height / 2 - 16, width: 140, height: 32 }, 24, 32, '#8E9BAC');
      }
      let bulletY = regions.bullets.y;
      bulletRows.forEach((row, index) => {
        if (bulletY + row.height > regions.bullets.y + regions.bullets.height) { errors.push({ field: 'bullets', message: '核心卖点内容放不下，请缩短文字' }); return; }
        elements.push({ kind: 'badge', x: isLeft ? 468 : 56, y: bulletY + 15, number: index + 1, color: theme });
        text('bullets', row.value, { x: bulletX, y: bulletY, width: bulletWidth, height: row.lines.length * bulletLineHeight }, bulletFont, bulletLineHeight, '#242832', 'bold');
        bulletY += row.height;
      });
      rounded(32, 892, 656, 84, 16, '#FFF3F4', { stroke: '#FFD2D7' });
      const group = parseMoneyToCents(state.groupPrice);
      const original = String(state.originalPrice).trim() ? parseMoneyToCents(state.originalPrice) : null;
      const groupLabel = group === null ? '¥ —' : `¥ ${(group / 100).toFixed(2)}`;
      const originalX = Math.min(374, Math.max(294, 52 + measureText(groupLabel, 56, 'bold') + 20));
      centeredText('groupPrice', groupLabel, 52, 934, original !== null && group !== null && original > group ? originalX - 64 : 608, 56, theme, 'bold');
      if (original !== null && group !== null && original > group) {
        const originalLabel = `原价 ¥${(original / 100).toFixed(2)}`;
        centeredText('originalPrice', originalLabel, originalX, 934, 510 - originalX, 20, '#8E99AA');
        elements.push({ kind: 'strike', x: originalX, y: 934, width: Math.min(510 - originalX, measureText(originalLabel, 20)), color: '#8E99AA' });
        rounded(520, 910, 160, 48, 24, theme);
        centeredText('discount', `立省 ¥${((original - group) / 100).toFixed(2)}`, 600, 934, 154, 22, '#FFFFFF', 'bold', 'center');
      }
      if (String(state.leaderNote).trim()) {
        rounded(32, 984, 656, 72, 12, '#F3F5F8');
        const noteLines = wrapText(String(state.leaderNote).trim(), 510, 21, measureText);
        const noteHeight = Math.min(noteLines.length, 2) * 24;
        const noteY = 984 + (72 - noteHeight) / 2;
        centeredText('leaderLabel', '团长说：', 48, 1020, 100, 21, theme, 'bold');
        text('leaderNote', state.leaderNote, { x: 153, y: noteY, width: 510, height: Math.min(48, 1056 - noteY) }, 21, 24, '#566177');
      }
      elements.push({ kind: 'dashed-line', x: 0, y: 1060, width: 720, color: '#DCE2E9' });
      rounded(32, 1064, 656, 204, 20, '#F7F8FA', { stroke: '#E7EBF0' });
      elements.push({ kind: 'qr', field: 'qr', x: 72, y: 1078, width: 176, height: 176, background: '#F7F8FA' });
      text('ctaMain', state.ctaMain, { x: 294, y: 1094, width: 370, height: 38 }, 27, 36, '#242832', 'bold');
      text('ctaSub', state.ctaSub, { x: 294, y: 1138, width: 370, height: 30 }, 20, 28, '#738098');
      text('shipping', state.shipping, { x: 294, y: 1176, width: 370, height: 74 }, 18, 24, '#738098');
      return { theme, regions, elements, errors };
    }

    function roundedPath(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawPoster(ctx, state, layout) {
      ctx.save();
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 720, 1280);
      for (const element of layout.elements) {
        if (element.kind === 'rect') { ctx.fillStyle = element.color; ctx.fillRect(element.x, element.y, element.width, element.height); }
        if (element.kind === 'round-rect') {
          ctx.save();
          roundedPath(ctx, element.x, element.y, element.width, element.height, element.radius);
          if (element.shadow) { ctx.shadowColor = 'rgba(29, 36, 48, 0.16)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 10; }
          ctx.fillStyle = element.color; ctx.fill();
          ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
          if (element.stroke) { ctx.strokeStyle = element.stroke; ctx.lineWidth = 1; ctx.stroke(); }
          ctx.restore();
        }
        if (element.kind === 'strike') { ctx.fillStyle = element.color; ctx.fillRect(element.x, element.y, element.width, 2); }
        if (element.kind === 'dashed-line') { ctx.save(); ctx.strokeStyle = element.color; ctx.lineWidth = 1; ctx.setLineDash([6, 5]); ctx.beginPath(); ctx.moveTo(element.x, element.y + 0.5); ctx.lineTo(element.x + element.width, element.y + 0.5); ctx.stroke(); ctx.restore(); }
        if (element.kind === 'text') {
          ctx.fillStyle = element.color;
          ctx.font = `${element.weight} ${element.fontSize}px "Microsoft YaHei", "PingFang SC", sans-serif`;
          ctx.textBaseline = element.baseline || 'top'; ctx.textAlign = element.align || 'left'; ctx.fillText(element.text, element.x, element.y);
        }
        if (element.kind === 'badge') {
          ctx.fillStyle = element.color; ctx.beginPath(); ctx.arc(element.x, element.y, 16, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px "Microsoft YaHei", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(element.number), element.x, element.y + 1); ctx.textAlign = 'left';
        }
        if (element.kind === 'image' && state.image) {
          const p = element.placement;
          ctx.save();
          roundedPath(ctx, p.x, p.y, p.width, p.height, element.radius);
          ctx.clip();
          ctx.drawImage(state.image.bitmap, p.sourceX, p.sourceY, p.sourceWidth, p.sourceHeight, p.drawX, p.drawY, p.drawWidth, p.drawHeight);
          ctx.restore();
          roundedPath(ctx, p.x + 1, p.y + 1, p.width - 2, p.height - 2, element.radius - 1);
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)'; ctx.lineWidth = 1; ctx.stroke();
        }
        if (element.kind === 'qr') {
          if (state.qr) {
            ctx.fillStyle = element.background; ctx.fillRect(element.x, element.y, element.width, element.height);
            const scale = Math.min(element.width / state.qr.width, element.height / state.qr.height);
            const width = state.qr.width * scale; const height = state.qr.height * scale;
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(state.qr.bitmap, element.x + (element.width - width) / 2, element.y + (element.height - height) / 2, width, height);
            ctx.imageSmoothingEnabled = true;
          } else {
            roundedPath(ctx, element.x, element.y, element.width, element.height, 16);
            ctx.fillStyle = '#EEF1F5'; ctx.fill();
            ctx.fillStyle = '#8E9BAC'; ctx.font = '20px "Microsoft YaHei", sans-serif'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.fillText('二维码', element.x + 88, element.y + 88); ctx.textAlign = 'left';
          }
        }
      }
      ctx.restore();
    }

    function validateForExport(state, layout) {
      const errors = [...validateFields(state), ...(layout?.errors || [])];
      if (!state.image) errors.push({ field: 'image', message: '请上传商品主图' });
      if (!state.qr) errors.push({ field: 'qr', message: '请上传二维码' });
      return errors;
    }

    function makeExportFilename(state, date) {
      const template = { center: '居中促销', left: '左图清单', hero: '大图爆款' }[state.template] || '居中促销';
      const cleaned = Array.from(String(state.title).replace(/[<>:"/\\|?*\x00-\x1f]/g, '')).slice(0, 20).join('').trim().replace(/[. ]+$/g, '') || '商品';
      const pad = number => String(number).padStart(2, '0');
      const stamp = `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}-${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
      return `团购海报_${template}_${cleaned}_${stamp}.png`;
    }

    function createExportController(renderToCanvas, downloadCanvas) {
      let busy = false;
      return {
        async export(state) {
          if (busy) return { ok: false, busy: true };
          busy = true;
          try {
            const snapshot = { ...state, bullets: [...state.bullets] };
            const prepared = renderToCanvas(snapshot);
            const errors = validateForExport(snapshot, prepared.layout);
            if (errors.length) return { ok: false, errors };
            const filename = makeExportFilename(snapshot, new Date());
            await downloadCanvas(prepared.canvas, filename);
            return { ok: true, filename };
          } catch (error) {
            return { ok: false, error: error?.message || 'PNG 生成失败，请重试' };
          } finally { busy = false; }
        },
      };
    }

    function init() {
      let state = createDefaultState();
      const selection = createImageSelectionController(async file => {
        const bitmap = await createImageBitmap(file);
        return { bitmap, width: bitmap.width, height: bitmap.height };
      });
      const uploadErrors = { image: '', qr: '' };
      const $ = selector => document.querySelector(selector);
      const $$ = selector => Array.from(document.querySelectorAll(selector));
      const status = $('#status');
      const canvas = $('#poster-canvas');
      const context = canvas.getContext('2d');
      const measure = (value, size, weight = 'normal') => { context.font = `${weight} ${size}px "Microsoft YaHei", "PingFang SC", sans-serif`; return context.measureText(value).width; };
      const exportController = createExportController(snapshot => {
        const output = document.createElement('canvas'); output.width = 720; output.height = 1280;
        const outputContext = output.getContext('2d');
        const outputMeasure = (value, size, weight = 'normal') => { outputContext.font = `${weight} ${size}px "Microsoft YaHei", "PingFang SC", sans-serif`; return outputContext.measureText(value).width; };
        const layout = buildPosterLayout(snapshot, outputMeasure);
        drawPoster(outputContext, snapshot, layout);
        return { canvas: output, layout };
      }, (output, filename) => new Promise((resolve, reject) => {
        output.toBlob(blob => {
          if (!blob) { reject(new Error('PNG 编码失败，请重试')); return; }
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement('a'); anchor.href = url; anchor.download = filename;
          anchor.click(); setTimeout(() => URL.revokeObjectURL(url), 60000);
          resolve();
        }, 'image/png');
      }));

      function setStatus(text) { status.textContent = text; }
      function showErrors(layoutErrors) {
        const errors = validateForExport(state, { errors: layoutErrors });
        $$('[data-error]').forEach(node => { node.textContent = uploadErrors[node.dataset.error] || errors.find(error => error.field === node.dataset.error)?.message || ''; });
        return errors;
      }
      function renderBullets() {
        const list = $('#bullet-list');
        list.replaceChildren();
        state.bullets.forEach((value, index) => {
          const row = document.createElement('div'); row.className = 'bullet-row';
          const input = document.createElement('input'); input.value = value; input.setAttribute('aria-label', `核心卖点 ${index + 1}`);
          input.addEventListener('input', () => { state.bullets[index] = input.value; refresh(); });
          const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'remove-bullet'; remove.textContent = '×'; remove.setAttribute('aria-label', `删除核心卖点 ${index + 1}`);
          remove.addEventListener('click', () => { state.bullets.splice(index, 1); renderBullets(); refresh(); });
          row.append(input, remove); list.append(row);
        });
        $('#add-bullet').disabled = state.bullets.length >= 6;
      }
      function refresh() {
        $$('[data-template]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.template === state.template)));
        const layout = buildPosterLayout(state, measure);
        showErrors(layout.errors);
        drawPoster(context, state, layout);
      }
      function fillInputs() {
        $$('[data-field]').forEach(input => { input.value = state[input.dataset.field]; });
        renderBullets(); refresh();
      }
      $$('[data-field]').forEach(input => input.addEventListener('input', () => { state[input.dataset.field] = input.value; refresh(); }));
      $$('[data-template]').forEach(button => button.addEventListener('click', () => { state.template = button.dataset.template; refresh(); }));
      $('#add-bullet').addEventListener('click', () => { if (state.bullets.length < 6) { state.bullets.push(''); renderBullets(); refresh(); } });
      async function onFileChange(kind, event) {
        const file = event.target.files?.[0] || null;
        if (!file) return;
        setStatus('正在检查图片…');
        const result = await selection.select(kind, file);
        event.target.value = '';
        if (result.stale) return;
        uploadErrors[kind] = result.errors?.[0]?.message || '';
        if (result.applied) { state[kind] = selection.current(kind); setStatus(kind === 'qr' ? '二维码已更新' : '商品主图已更新'); }
        else setStatus(uploadErrors[kind] || '未更换图片');
        refresh();
      }
      $('#image-file').addEventListener('change', event => onFileChange('image', event));
      $('#qr-file').addEventListener('change', event => onFileChange('qr', event));
      $('#reset').addEventListener('click', () => {
        selection.clear('image'); selection.clear('qr'); uploadErrors.image = ''; uploadErrors.qr = '';
        $('#image-file').value = ''; $('#qr-file').value = '';
        state = createDefaultState(); fillInputs(); setStatus('已恢复示例');
      });
      $('#export').addEventListener('click', async () => {
        const button = $('#export'); button.disabled = true;
        setStatus('正在生成 PNG…');
        const result = await exportController.export(state);
        if (result.ok) setStatus(`已生成 ${result.filename}`);
        else if (result.errors) { refresh(); setStatus(`无法导出：${result.errors[0].message}`); }
        else setStatus(result.busy ? '正在导出，请稍候' : `导出失败：${result.error || '请重试'}`);
        button.disabled = false;
      });
      fillInputs(); setStatus('请上传商品主图和二维码后导出 PNG。');
    }
    return { core: { createDefaultState, countCodePoints, parseMoneyToCents, validateFields, validateImageMeta, createImageSelectionController, computeImagePlacement, buildPosterLayout, drawPoster, validateForExport, makeExportFilename, createExportController }, init };
  })();
  if (typeof document !== 'undefined') app.init();
  </script>
</body>
